<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">Reading a technique as a pairing</title>
  <desc id="d">Every technique in this guide is read across four columns: the technique class, what the defender observes, the control that stops it, and the signal that detects it. A probe travels left to right and is stopped at the control.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow  { stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    .beat  { animation: pulse 5s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="520" fill="#F6F4EF"/>
  <text x="48" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#7A8088">FIG. 1  ·  HOW EACH SHEET IS STRUCTURED</text>
  <text x="48" y="94" class="serif" font-size="26" font-weight="600" fill="#1B1F24">A technique is never learned without its defence</text>

  <!-- flow spine -->
  <path class="flow" d="M228,210 L1064,210" fill="none" stroke="#5B7083" stroke-width="1.75"/>

  <!-- col 1 technique -->
  <rect x="48" y="150" width="200" height="120" rx="4" fill="#F6E9E6" stroke="#A33A2B" stroke-width="1.5"/>
  <rect x="48" y="150" width="200" height="3" fill="#A33A2B"/>
  <text x="68" y="182" class="mono" font-size="12" letter-spacing="1" fill="#A33A2B">TECHNIQUE CLASS</text>
  <text x="68" y="214" class="sans" font-size="15" fill="#1B1F24">untrusted input reaches</text>
  <text x="68" y="236" class="sans" font-size="15" fill="#1B1F24">a sensitive operation</text>

  <!-- col 2 observed -->
  <rect x="320" y="150" width="200" height="120" rx="4" fill="#fff" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="340" y="182" class="mono" font-size="12" letter-spacing="1" fill="#7A8088">DEFENDER SEES</text>
  <text x="340" y="214" class="sans" font-size="15" fill="#1B1F24">anomalous request,</text>
  <text x="340" y="236" class="sans" font-size="15" fill="#1B1F24">unusual query shape</text>

  <!-- col 3 control (the stop) -->
  <rect x="592" y="150" width="200" height="120" rx="4" fill="#E8EDF3" stroke="#1F3A5F" stroke-width="1.5"/>
  <rect x="592" y="150" width="200" height="3" fill="#1F3A5F"/>
  <text x="612" y="182" class="mono" font-size="12" letter-spacing="1" fill="#1F3A5F">CONTROL THAT STOPS IT</text>
  <text x="612" y="214" class="sans" font-size="15" fill="#1B1F24">separate data from</text>
  <text x="612" y="236" class="sans" font-size="15" fill="#1B1F24">command; least privilege</text>
  <path class="beat" d="M744,250 l11,11 l22,-24" fill="none" stroke="#1F3A5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- col 4 detection -->
  <rect x="864" y="150" width="200" height="120" rx="4" fill="#EDF0F3" stroke="#5B7083" stroke-width="1.5"/>
  <text x="884" y="182" class="mono" font-size="12" letter-spacing="1" fill="#5B7083">DETECTION</text>
  <text x="884" y="214" class="sans" font-size="15" fill="#1B1F24">alert on the logged</text>
  <text x="884" y="236" class="sans" font-size="15" fill="#1B1F24">anomaly, then triage</text>

  <!-- probe stopped at control -->
  <circle r="6" fill="#A33A2B" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="5s" repeatCount="indefinite" path="M228,210 L640,210 L640,210" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.72;0.8;1"/>
  </circle>
  <!-- signal emitted from control to detection -->
  <circle r="5" fill="#5B7083" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="5s" repeatCount="indefinite" path="M692,210 L960,210" keyPoints="0;0;1" keyTimes="0;0.72;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.72;0.78;1"/>
  </circle>

  <!-- worked examples row -->
  <text x="48" y="336" class="mono" font-size="12" letter-spacing="1" fill="#7A8088">WORKED THE SAME WAY ACROSS THE GUIDE</text>
  <g class="sans" font-size="14" fill="#1B1F24">
    <rect x="48" y="356" width="1016" height="128" rx="4" fill="#fff" stroke="#DAD6CC" stroke-width="1.5"/>
    <line x1="48" y1="398" x2="1064" y2="398" stroke="#DAD6CC"/>
    <line x1="48" y1="440" x2="1064" y2="440" stroke="#DAD6CC"/>
    <line x1="300" y1="356" x2="300" y2="484" stroke="#DAD6CC"/>
    <line x1="640" y1="356" x2="640" y2="484" stroke="#DAD6CC"/>
    <text class="mono" x="66" y="382" font-size="11" fill="#A33A2B">TECHNIQUE</text>
    <text class="mono" x="318" y="382" font-size="11" fill="#1F3A5F">CONTROL</text>
    <text class="mono" x="658" y="382" font-size="11" fill="#5B7083">DETECTION</text>
    <text x="66" y="424">SQL injection</text>
    <text x="318" y="424">parameterised queries</text>
    <text x="658" y="424">query-error / anomaly alerts</text>
    <text x="66" y="466">man-in-the-middle</text>
    <text x="318" y="466">encrypt everything in transit</text>
    <text x="658" y="466">unexpected ARP / new gateway</text>
  </g>
</svg>
