<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">The authorised engagement loop</title>
  <desc id="d">An authorised security assessment runs as a loop: authorise and scope, reconnaissance, assessment, report, remediate, then retest. Authorisation gates the whole loop, and the report and remediation are where the value is.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .orbit { animation: spin 12s linear infinite; transform-origin: 600px 300px; }
    .gate  { animation: pulse 5s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes pulse { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="520" fill="#F5F7FA"/>
  <text x="48" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#6B7688">FIG. 2  ·  AUTHORISED ASSESSMENT, AS A LOOP</text>
  <text x="48" y="94" class="display" font-size="26" font-weight="600" fill="#0E1726">Authorisation gates it; the report is the product</text>

  <circle cx="600" cy="300" r="150" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="150" fill="none" stroke="#3E5C76" stroke-width="1.75" stroke-dasharray="4 14" stroke-linecap="round" opacity=".8"/>
  <g class="orbit"><circle cx="600" cy="150" r="5" fill="#0B2545"/></g>

  <!-- top: authorise (gate) -->
  <g class="gate"><rect x="510" y="122" width="180" height="56" rx="4" fill="#EDF1F6" stroke="#0B2545" stroke-width="1.75"/></g>
  <rect x="510" y="122" width="180" height="56" rx="4" fill="none" stroke="#0B2545" stroke-width="1.75"/>
  <text x="600" y="148" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#0B2545">01  AUTHORISE &amp; SCOPE</text>
  <text x="600" y="167" text-anchor="middle" class="sans" font-size="12" fill="#0E1726">written rules of engagement</text>

  <!-- upper right: recon -->
  <rect x="770" y="200" width="170" height="52" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="855" y="224" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#6B7688">02  RECON</text>
  <text x="855" y="242" text-anchor="middle" class="sans" font-size="12" fill="#0E1726">passive first, in scope</text>

  <!-- lower right: assess -->
  <rect x="770" y="350" width="170" height="52" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="855" y="374" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#6B7688">03  ASSESS</text>
  <text x="855" y="392" text-anchor="middle" class="sans" font-size="12" fill="#0E1726">confirm, prove impact</text>

  <!-- bottom: report (value) -->
  <rect x="510" y="422" width="180" height="56" rx="4" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.75"/>
  <rect x="510" y="422" width="180" height="3" fill="#2F6F73"/>
  <text x="600" y="448" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#2F6F73">04  REPORT</text>
  <text x="600" y="467" text-anchor="middle" class="sans" font-size="12" fill="#0E1726">reproducible, prioritised</text>

  <!-- lower left: remediate (value) -->
  <rect x="260" y="350" width="170" height="52" rx="4" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.5"/>
  <text x="345" y="374" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#2F6F73">05  REMEDIATE</text>
  <text x="345" y="392" text-anchor="middle" class="sans" font-size="12" fill="#0E1726">apply the controls</text>

  <!-- upper left: retest -->
  <rect x="260" y="200" width="170" height="52" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="345" y="224" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#6B7688">06  RETEST</text>
  <text x="345" y="242" text-anchor="middle" class="sans" font-size="12" fill="#0E1726">confirm the fix holds</text>

  <text x="600" y="294" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#6B7688">NEVER STARTS</text>
  <text x="600" y="312" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#6B7688">WITHOUT 01</text>
</svg>
