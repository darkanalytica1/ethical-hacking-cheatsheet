<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">The authorised engagement loop</title>
  <desc id="d">An authorised security assessment runs as a loop: authorise and scope, reconnaissance, assessment, report, remediate, then retest. Authorisation gates the whole loop, and the report and remediation are where the value is.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .orbit { animation: spin 12s linear infinite; transform-origin: 600px 300px; }
    .gate  { animation: pulse 5s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes pulse { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="520" fill="#F6F4EF"/>
  <text x="48" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#7A8088">FIG. 2  ·  AUTHORISED ASSESSMENT, AS A LOOP</text>
  <text x="48" y="94" class="serif" font-size="26" font-weight="600" fill="#1B1F24">Authorisation gates it; the report is the product</text>

  <circle cx="600" cy="300" r="150" fill="none" stroke="#DAD6CC" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="150" fill="none" stroke="#5B7083" stroke-width="1.75" stroke-dasharray="4 14" stroke-linecap="round" opacity=".8"/>
  <g class="orbit"><circle cx="600" cy="150" r="5" fill="#1F3A5F"/></g>

  <!-- top: authorise (gate) -->
  <g class="gate"><rect x="510" y="122" width="180" height="56" rx="4" fill="#E8EDF3" stroke="#1F3A5F" stroke-width="1.75"/></g>
  <rect x="510" y="122" width="180" height="56" rx="4" fill="none" stroke="#1F3A5F" stroke-width="1.75"/>
  <text x="600" y="148" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#1F3A5F">01  AUTHORISE &amp; SCOPE</text>
  <text x="600" y="167" text-anchor="middle" class="sans" font-size="12" fill="#1B1F24">written rules of engagement</text>

  <!-- upper right: recon -->
  <rect x="770" y="200" width="170" height="52" rx="4" fill="#fff" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="855" y="224" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">02  RECON</text>
  <text x="855" y="242" text-anchor="middle" class="sans" font-size="12" fill="#1B1F24">passive first, in scope</text>

  <!-- lower right: assess -->
  <rect x="770" y="350" width="170" height="52" rx="4" fill="#fff" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="855" y="374" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">03  ASSESS</text>
  <text x="855" y="392" text-anchor="middle" class="sans" font-size="12" fill="#1B1F24">confirm, prove impact</text>

  <!-- bottom: report (value) -->
  <rect x="510" y="422" width="180" height="56" rx="4" fill="#EAF0EB" stroke="#5E7F68" stroke-width="1.75"/>
  <rect x="510" y="422" width="180" height="3" fill="#5E7F68"/>
  <text x="600" y="448" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#5E7F68">04  REPORT</text>
  <text x="600" y="467" text-anchor="middle" class="sans" font-size="12" fill="#1B1F24">reproducible, prioritised</text>

  <!-- lower left: remediate (value) -->
  <rect x="260" y="350" width="170" height="52" rx="4" fill="#EAF0EB" stroke="#5E7F68" stroke-width="1.5"/>
  <text x="345" y="374" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#5E7F68">05  REMEDIATE</text>
  <text x="345" y="392" text-anchor="middle" class="sans" font-size="12" fill="#1B1F24">apply the controls</text>

  <!-- upper left: retest -->
  <rect x="260" y="200" width="170" height="52" rx="4" fill="#fff" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="345" y="224" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">06  RETEST</text>
  <text x="345" y="242" text-anchor="middle" class="sans" font-size="12" fill="#1B1F24">confirm the fix holds</text>

  <text x="600" y="294" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">NEVER STARTS</text>
  <text x="600" y="312" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">WITHOUT 01</text>
</svg>
